name: PR Audit
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - edited

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-audit:
    name: Audit
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup PNPM with Dependencies
        uses: ./.github/actions/setup-pnpm-with-dependencies/

      - name: PR Audit
        if: github.actor != 'renovate[bot]'
        uses: Kong/public-shared-actions/pr-previews/audit@43112b0f261fbe0ba7551cba05fba936a7532b58
        with:
          renovate-pr-author: renovate[bot]
